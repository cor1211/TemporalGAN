# Dataset config
data:
  root: '/mnt/data1tb/vinh/TemporalGAN/dataset/o2s_splited'
  train_batch_size: 24
  valid_batch_size: 24
  train_folder_name: 'train/triplet_vh'
  valid_folder_name: 'valid/triplet_vh'
  test_folder_name: 'test/triplet_vh'
  modalities: ['s1', 's2', 'lc']
  num_workers: 2

# Training config
train:
  device: cuda
  seed: 42
  total_epochs: 250
  betas: [0.5, 0.999]
  lr: 0.00001
  val_step: 1000
  lambda_l1: 100
  gan_loss: 'bce'  # 'mse' for LSGAN or 'bce' for vanilla GAN
  use_grad_clip: True
  grad_clip_norm: 1.0
  resume_path: 
  strict_netG: True
  strict_netD: True

# Model architecture config
model:
  generator: gen_s2_lc_v1_1
  discriminator: disc_s2_lc_v1_0


